project:
  type: website
  output-dir: docs 
  resources:
    - "downloads/**"
website:
  title: "babyPHONO"
  site-url: "https://babyphono.org"
  description: "babyPHONO is a neonatal research study investigating digital heart sound recordings, newborn screening and congenital heart disease."
  search: true
  navbar:
    left:
      - href: index.qmd
        text: "Home"
      - href: about.qmd
        text: "About"
      - href: study-team.qmd
        text: "Study team"
      - text: "Participant Information"
        menu:
          - text: "Babies Having an Echo"
            href: echo-information.qmd
          - text: "Babies Having a NIPE"
            href: nipe-information.qmd
          - text: "Clinician Participants"
            href: clinician-information.qmd
      - text: "Consent Forms"
        menu:
          - text: "Babies Having an Echo"
            href: echo-consent.qmd
          - text: "Babies Having a NIPE"
            href: nipe-consent.qmd
          - text: "Clinician Participants"
            href: clinician-consent.qmd
      - text: "Questionnaires"
        menu:
          - text: "Babies Having an Echo"
            href: echo-questionnaire.qmd
          - text: "Babies Having a NIPE"
            href: nipe-questionnaire.qmd
      - href: translations.qmd
        text: Translations
    logo: images/babyphono_logo_purple.png
    
format:
  html:
    page-layout: full
    pretty_urls: true
    lang: en-GB
    include-in-header:
      - file: meta.html
      - text: |
          <script data-goatcounter="https://neilxlawrence.goatcounter.com/count"
                  async src="https://gc.zgo.at/count.js"></script>
    theme:
      - cosmo
      - brand
    css: styles.css
    toc: true

editor: visual
